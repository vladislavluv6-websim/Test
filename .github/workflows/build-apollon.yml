name: Build Apollon GUI APK

on:
  workflow_dispatch:
  push:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK packages
        run: |
          set -e
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SM="$(command -v sdkmanager || true)"
          if [ -z "$SM" ]; then
            SM="$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' | head -n1)"
          fi
          echo "Using sdkmanager: $SM"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" "platform-tools" "platforms;android-30" "build-tools;30.0.3" "ndk;21.4.7075529"

      - name: Build APK
        run: bash build_apk.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Apollon-GUI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
